name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      SHOWCASE_MODE: "true"
      NEXT_PUBLIC_SHOWCASE_MODE: "true"
      NEXT_PUBLIC_APP_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_FORCE_CLERK: "false"
      NEXT_PUBLIC_DEV_AUTH_USER_ID: showcase-ci-user
      AUTH_DEV_MODE: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_music
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_music
      REDIS_URL: redis://localhost:6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: ./storage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
